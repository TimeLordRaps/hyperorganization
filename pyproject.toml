[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperoptimization"
version = "0.1.0.dev0"
description = "Optimization as a self-closing process: existence, freedom, corrigibility and renewal, without money"
requires-python = ">=3.10"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Tyler Roost"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "pytest-timeout>=2.3"]
dev = ["pytest>=8", "pytest-timeout>=2.3", "ruff>=0.11", "build>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hyperoptimization = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-vv -s --durations=10 --timeout=60"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
